name: Generate Language Metrics
on:
  schedule:
    - cron: "0 0 * * *" # Автозапуск раз в сутки
  workflow_dispatch:   # Ручной запуск кнопкой

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compute Languages across all repos
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mainparadox
          template: classic
          base: ""
          config_timezone: Europe/Minsk
          theme: dark
          output_action: commit
          filename: github-metrics.svg
          
          # Языки программирования (считаем весь репозиторий, а не только недавние пуши)
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          
          # Учитывать репозитории организации и личные закрытые проекты
          repositories_affiliations: owner, collaborator, organization_member
