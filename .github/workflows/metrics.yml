name: Generate Language Metrics
on:
  schedule:
    - cron: "0 0 * * *" # Запуск каждую ночь
  workflow_dispatch:   # Кнопка ручного запуска в Actions

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compute Languages across Public, Private and Organization Repos
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mainparadox
          template: classic
          base: ""
          config_timezone: Europe/Minsk
          output_action: commit
          filename: github-metrics.svg
          
          # Анализ языков
          plugin_languages: yes
          plugin_languages_ignored: "html, css, tex, less, dockerfile"
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          
          # Сканирование личных и закрытых репозиториев организации
          repositories_affiliations: owner, collaborator, organization_member
