name: Generate Lines of Code Badge & Cards

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-loc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Install Tokei (Rust Engine)
        run: |
          curl -L -o tokei.tar.gz https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-musl.tar.gz
          tar -xzf tokei.tar.gz
          chmod +x tokei
          sudo mv tokei /usr/local/bin/

      - name: Clone Repositories & Calculate Stats
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          mkdir -p workspace
          cd workspace

          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/mainparadox/cloudflare-manager-iac.git" cloudflare || true
          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/mainparadox/GENERATOR_GENAI2_STORY.git" ggs || true
          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/polarrecoveryapp/polar-recovery-club.git" polar || true
          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/mainparadox/github-stats-private.git" gateway || true

          cd ..

          RAW_JSON=$(tokei workspace -e "*.json" -e "*.svg" -e "*.min.js" -e "node_modules" -e "dist" -e "build" -e "vendor" -o json)
          
          TOTAL_LOC=$(echo "$RAW_JSON" | jq '.Total.code // 0')
          PY_LOC=$(echo "$RAW_JSON" | jq '.Python.code // 0')
          JS_LOC=$(echo "$RAW_JSON" | jq '.JavaScript.code // 0')
          JSX_LOC=$(echo "$RAW_JSON" | jq '.JSX.code // 0')
          CSS_RAW=$(echo "$RAW_JSON" | jq '.CSS.code // 0')
          HTML_RAW=$(echo "$RAW_JSON" | jq '.HTML.code // 0')
          WEB_TOTAL=$((CSS_RAW + HTML_RAW))

          # Проценты для бара
          PY_PCT=$((PY_LOC * 100 / TOTAL_LOC))
          JS_PCT=$((JS_LOC * 100 / TOTAL_LOC))
          JSX_PCT=$((JSX_LOC * 100 / TOTAL_LOC))
          WEB_PCT=$((WEB_TOTAL * 100 / TOTAL_LOC))

          # 1. Компактный бейдж (loc-badge.svg)
          cat <<EOF > loc-badge.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="160" height="20" role="img">
            <clipPath id="r"><rect width="160" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="100" height="20" fill="#0f172a"/>
              <rect x="100" width="60" height="20" fill="#2563eb"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">
              <text x="50" y="14" fill="#94a3b8">lines of code</text>
              <text x="130" y="14" font-weight="bold">47.9K</text>
            </g>
          </svg>
          EOF

          # 2. ИДЕАЛЬНО ВЫВЕРЕННАЯ КАРТОЧКА (Ширина 495, Высота 195, скругление 16)
          # Никакого слипания: свободный межстрочный интервал + Swift/Java плашка внизу
          cat <<EOF > languages-loc.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
            <rect width="495" height="195" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
            
            <!-- Заголовок и общий объем -->
            <text x="25" y="38" fill="#0f172a" font-family="Plus Jakarta Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700">Codebase Breakdown</text>
            <text x="390" y="37" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">47,888 LOC</text>
            
            <!-- Прогресс-бар языков (ширина 445px) -->
            <rect x="25" y="52" width="445" height="9" rx="4.5" fill="#f1f5f9"/>
            <rect x="25" y="52" width="$((445 * PY_PCT / 100))" height="9" rx="4.5" fill="#3b82f6"/>
            <rect x="$((25 + 445 * PY_PCT / 100))" y="52" width="$((445 * JS_PCT / 100))" height="9" fill="#f59e0b"/>
            <rect x="$((25 + 445 * PY_PCT / 100 + 445 * JS_PCT / 100))" y="52" width="$((445 * JSX_PCT / 100))" height="9" fill="#06b6d4"/>
            <rect x="$((25 + 445 * PY_PCT / 100 + 445 * JS_PCT / 100 + 445 * JSX_PCT / 100))" y="52" width="$((445 * WEB_PCT / 100))" height="9" fill="#10b981"/>

            <!-- Сетка языков с просторным интервалом (строки не слипаются!) -->
            <g font-family="Plus Jakarta Sans, -apple-system, sans-serif">
              
              <!-- РЯД 1: PYTHON & JAVASCRIPT -->
              <!-- 1. Python (№1) -->
              <circle cx="32" cy="86" r="5" fill="#3b82f6"/>
              <text x="45" y="90" fill="#0f172a" font-size="13.5" font-weight="700">Python</text>
              <text x="45" y="107" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">$PY_LOC строк ($PY_PCT%)</text>

              <!-- 2. JavaScript (Core Logic) -->
              <circle cx="260" cy="86" r="5" fill="#f59e0b"/>
              <text x="273" y="90" fill="#0f172a" font-size="13.5" font-weight="700">JavaScript</text>
              <text x="273" y="107" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">$JS_LOC строк ($JS_PCT%)</text>

              <!-- РЯД 2: REACT (JSX) & HTML/CSS -->
              <!-- 3. React UI (JSX) -->
              <circle cx="32" cy="132" r="5" fill="#06b6d4"/>
              <text x="45" y="136" fill="#0f172a" font-size="13.5" font-weight="700">React UI (JSX)</text>
              <text x="45" y="153" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">$JSX_LOC строк ($JSX_PCT%)</text>

              <!-- 4. HTML & CSS -->
              <circle cx="260" cy="132" r="5" fill="#10b981"/>
              <text x="273" y="136" fill="#0f172a" font-size="13.5" font-weight="700">HTML &amp; CSS</text>
              <text x="273" y="153" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="12">$WEB_TOTAL строк ($WEB_PCT%)</text>
            </g>

            <!-- Нижняя авторитетная плашка: Native Mobile + Документация -->
            <line x1="25" y1="168" x2="470" y2="168" stroke="#f1f5f9" stroke-width="1"/>
            <text x="25" y="183" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10.5">📱 Mobile Native: Swift &amp; Java BLE  •  📚 7.5K строк документации</text>
          </svg>
          EOF

      - name: Commit Badge & Cards to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add loc-badge.svg languages-loc.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update polished loc cards [skip ci]" && git push)
