name: Generate Lines of Code Badge & Cards

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-loc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Install Tokei (Rust Engine)
        run: |
          curl -L -o tokei.tar.gz https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-musl.tar.gz
          tar -xzf tokei.tar.gz
          chmod +x tokei
          sudo mv tokei /usr/local/bin/

      - name: Clone Repositories & Calculate Stats
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          mkdir -p workspace
          cd workspace

          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/mainparadox/cloudflare-manager-iac.git" cloudflare || true
          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/mainparadox/GENERATOR_GENAI2_STORY.git" ggs || true
          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/polarrecoveryapp/polar-recovery-club.git" polar || true
          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/mainparadox/github-stats-private.git" gateway || true

          cd ..

          RAW_JSON=$(tokei workspace -e "*.json" -e "*.svg" -e "*.min.js" -e "node_modules" -e "dist" -e "build" -e "vendor" -o json)
          
          TOTAL_LOC=$(echo "$RAW_JSON" | jq '.Total.code // 0')
          PY_LOC=$(echo "$RAW_JSON" | jq '.Python.code // 0')
          JS_LOC=$(echo "$RAW_JSON" | jq '.JavaScript.code // 0')
          JSX_LOC=$(echo "$RAW_JSON" | jq '.JSX.code // 0')
          CSS_RAW=$(echo "$RAW_JSON" | jq '.CSS.code // 0')
          HTML_RAW=$(echo "$RAW_JSON" | jq '.HTML.code // 0')
          WEB_TOTAL=$((CSS_RAW + HTML_RAW))

          # Проценты для бара
          PY_PCT=$((PY_LOC * 100 / TOTAL_LOC))
          JS_PCT=$((JS_LOC * 100 / TOTAL_LOC))
          JSX_PCT=$((JSX_LOC * 100 / TOTAL_LOC))
          WEB_PCT=$((WEB_TOTAL * 100 / TOTAL_LOC))

          # 1. Бейдж строк кода
          cat <<EOF > loc-badge.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="160" height="20" role="img">
            <clipPath id="r"><rect width="160" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="100" height="20" fill="#0f172a"/>
              <rect x="100" width="60" height="20" fill="#2563eb"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">
              <text x="50" y="14" fill="#94a3b8">lines of code</text>
              <text x="130" y="14" font-weight="bold">47.9K</text>
            </g>
          </svg>
          EOF

          # 2. ИДЕАЛЬНАЯ ГЕОМЕТРИЯ 400x195 (В точности под размер левой карточки Vercel)
          cat <<EOF > languages-loc.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="400" height="195" viewBox="0 0 400 195" fill="none">
            <rect width="400" height="195" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
            
            <!-- Заголовок и общий объем (Крупный, четкий) -->
            <text x="22" y="36" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16.5" font-weight="700">Codebase Languages</text>
            <text x="312" y="35" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">47.9K LOC</text>
            
            <!-- Прогресс-бар языков (ширина 356px) -->
            <rect x="22" y="49" width="356" height="8" rx="4" fill="#f1f5f9"/>
            <rect x="22" y="49" width="$((356 * PY_PCT / 100))" height="8" rx="4" fill="#3b82f6"/>
            <rect x="$((22 + 356 * PY_PCT / 100))" y="49" width="$((356 * JS_PCT / 100))" height="8" fill="#f59e0b"/>
            <rect x="$((22 + 356 * PY_PCT / 100 + 356 * JS_PCT / 100))" y="49" width="$((356 * JSX_PCT / 100))" height="8" fill="#06b6d4"/>
            <rect x="$((22 + 356 * PY_PCT / 100 + 356 * JS_PCT / 100 + 356 * JSX_PCT / 100))" y="49" width="$((356 * WEB_PCT / 100))" height="8" fill="#10b981"/>

            <!-- Сетка языков: крупный шрифт и просторный интервал -->
            <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
              
              <!-- РЯД 1: PYTHON & JAVASCRIPT -->
              <circle cx="28" cy="81" r="5" fill="#3b82f6"/>
              <text x="40" y="85" fill="#0f172a" font-size="13.5" font-weight="700">Python</text>
              <text x="40" y="101" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11.5">$PY_LOC строк ($PY_PCT%)</text>

              <circle cx="212" cy="81" r="5" fill="#f59e0b"/>
              <text x="224" y="85" fill="#0f172a" font-size="13.5" font-weight="700">JavaScript</text>
              <text x="224" y="101" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11.5">$JS_LOC строк ($JS_PCT%)</text>

              <!-- РЯД 2: REACT UI & HTML/CSS -->
              <circle cx="28" cy="126" r="5" fill="#06b6d4"/>
              <text x="40" y="130" fill="#0f172a" font-size="13.5" font-weight="700">React UI (JSX)</text>
              <text x="40" y="146" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11.5">$JSX_LOC строк ($JSX_PCT%)</text>

              <circle cx="212" cy="126" r="5" fill="#10b981"/>
              <text x="224" y="130" fill="#0f172a" font-size="13.5" font-weight="700">HTML &amp; CSS</text>
              <text x="224" y="146" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11.5">$WEB_TOTAL строк ($WEB_PCT%)</text>
            </g>

            <!-- Нижняя плашка -->
            <line x1="22" y1="162" x2="378" y2="162" stroke="#f1f5f9" stroke-width="1"/>
            <text x="22" y="179" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10.5">📱 Swift/Java BLE  •  📚 7.5K строк документации</text>
          </svg>
          EOF

      - name: Commit Badge & Cards to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add loc-badge.svg languages-loc.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: pixel-perfect 400x195 loc card [skip ci]" && git push)
