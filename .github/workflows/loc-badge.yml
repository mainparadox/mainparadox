name: Generate Lines of Code Badge

on:
  schedule:
    - cron: '0 0 * * *' # Раз в сутки ночью
  workflow_dispatch:     # Кнопка ручного запуска

jobs:
  build-loc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Install Tokei (Rust Engine)
        run: |
          curl -L -o tokei.tar.gz https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-musl.tar.gz
          tar -xzf tokei.tar.gz
          chmod +x tokei
          sudo mv tokei /usr/local/bin/

      - name: Auto-Discover & Clone ALL Repositories (Public, Private, Orgs)
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          mkdir -p workspace
          cd workspace

          echo "🔍 Опрашиваем GitHub API на наличие всех доступных репозиториев..."
          
          # Получаем список всех ваших репозиториев (личные + организации), исключая форки:
          REPO_URLS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/user/repos?per_page=100&affiliation=owner,organization_member" \
            | jq -r '.[] | select(.fork == false) | .clone_url')

          for url in $REPO_URLS; do
            repo_name=$(basename "$url" .git)
            # Внедряем токен для безопасного клонирования закрытых репозиториев:
            auth_url=$(echo "$url" | sed -e "s|https://|https://mainparadox:${GH_TOKEN}@|")
            
            echo "📥 Скачиваем срез: $repo_name ..."
            git clone --depth 1 "$auth_url" "$repo_name" || true
          done

          cd ..

          echo "⚡ Запускаем подсчет чистого кода утилитой Tokei..."
          
          # Считаем только реальный код (отсекаем package-lock, json, svg, dist, build, min.js)
          RAW_JSON=$(tokei workspace -e "*.json" -e "*.svg" -e "*.min.js" -e "node_modules" -e "dist" -e "build" -e "vendor" -o json)
          TOTAL_LOC=$(echo "$RAW_JSON" | jq '.Total.code // 0')
          
          echo "=============================================="
          echo "ИТОГО ЧИСТЫХ СТРОК КОДА ВО ВСЕХ РЕПОЗИТОРИЯХ: $TOTAL_LOC"
          echo "=============================================="

          # Форматируем число (например, 142500 -> 142.5K)
          if [ $TOTAL_LOC -ge 1000000 ]; then
            FORMATTED_LOC=$(awk "BEGIN {printf \"%.1fM\", $TOTAL_LOC/1000000}")
          elif [ $TOTAL_LOC -ge 1000 ]; then
            FORMATTED_LOC=$(awk "BEGIN {printf \"%.1fK\", $TOTAL_LOC/1000}")
          else
            FORMATTED_LOC=$TOTAL_LOC
          fi

          # Генерируем компактный SVG-бейдж
          cat <<EOF > loc-badge.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="160" height="20" role="img">
            <clipPath id="r"><rect width="160" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="100" height="20" fill="#0f172a"/>
              <rect x="100" width="60" height="20" fill="#2563eb"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11">
              <text x="50" y="14" fill="#94a3b8">lines of code</text>
              <text x="130" y="14" font-weight="bold">$FORMATTED_LOC</text>
            </g>
          </svg>
          EOF

      - name: Commit Badge to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add loc-badge.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update total lines of code [skip ci]" && git push)
