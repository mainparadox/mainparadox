# Считаем точные строки по каждому проекту отдельно
POLAR_LOC=$(tokei workspace/polar -o json | jq '.Total.code // 0')
GGS_LOC=$(tokei workspace/ggs -o json | jq '.Total.code // 0')
CF_LOC=$(tokei workspace/cloudflare -o json | jq '.Total.code // 0')

# Форматируем в компактный вид (например 23412 -> 23.4K)
F_POLAR=$(awk "BEGIN {printf \"%.1fK\", $POLAR_LOC/1000}")
F_GGS=$(awk "BEGIN {printf \"%.1fK\", $GGS_LOC/1000}")
F_CF=$(awk "BEGIN {printf \"%.1fK\", $CF_LOC/1000}")

# 1. Бейдж для Polar Club (Синий)
cat <<EOF > badge-polar.svg
<svg xmlns="http://www.w3.org/2000/svg" width="135" height="20" role="img">
  <clipPath id="r"><rect width="135" height="20" rx="4" fill="#fff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="70" height="20" fill="#0f172a"/>
    <rect x="70" width="65" height="20" fill="#0284c7"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
    <text x="35" y="14" fill="#94a3b8">codebase</text>
    <text x="102" y="14" font-weight="bold">$F_POLAR LOC</text>
  </g>
</svg>
EOF

# 2. Бейдж для GGS Video Engine (Красный)
cat <<EOF > badge-ggs.svg
<svg xmlns="http://www.w3.org/2000/svg" width="135" height="20" role="img">
  <clipPath id="r"><rect width="135" height="20" rx="4" fill="#fff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="70" height="20" fill="#0f172a"/>
    <rect x="70" width="65" height="20" fill="#dc2626"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
    <text x="35" y="14" fill="#94a3b8">codebase</text>
    <text x="102" y="14" font-weight="bold">$F_GGS LOC</text>
  </g>
</svg>
EOF

# 3. Бейдж для Cloudflare IaC (Оранжевый)
cat <<EOF > badge-cloudflare.svg
<svg xmlns="http://www.w3.org/2000/svg" width="135" height="20" role="img">
  <clipPath id="r"><rect width="135" height="20" rx="4" fill="#fff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="70" height="20" fill="#0f172a"/>
    <rect x="70" width="65" height="20" fill="#ea580c"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
    <text x="35" y="14" fill="#94a3b8">codebase</text>
    <text x="102" y="14" font-weight="bold">$F_CF LOC</text>
  </g>
</svg>
EOF
