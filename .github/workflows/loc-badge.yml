name: Generate Lines of Code Badge & Cards

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-loc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Install Tokei (Rust Engine)
        run: |
          curl -L -o tokei.tar.gz https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-musl.tar.gz
          tar -xzf tokei.tar.gz
          chmod +x tokei
          sudo mv tokei /usr/local/bin/

      - name: Clone All Repositories & Generate Cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import math
          import os
          import subprocess
          import urllib.request

          gh_token = os.environ.get("GH_TOKEN", "").strip()
          workspace = "workspace"
          os.makedirs(workspace, exist_ok=True)

          # 1. Получаем все не-форк репозитории через GitHub API
          repos = {}
          if gh_token:
              page = 1
              while True:
                  url = f"https://api.github.com/user/repos?per_page=100&page={page}&affiliation=owner,collaborator,organization_member"
                  req = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": f"Bearer {gh_token}",
                          "Accept": "application/vnd.github+json",
                          "User-Agent": "tokei-loc-generator",
                      },
                  )
                  with urllib.request.urlopen(req) as resp:
                      batch = json.loads(resp.read().decode("utf-8"))
                  if not batch:
                      break
                  for r in batch:
                      full_name = r.get("full_name", "")
                      if r.get("fork") or full_name.lower() == "mainparadox/mainparadox":
                          continue
                      repos[full_name] = True
                  if len(batch) < 100:
                      break
                  page += 1

          # Гарантируем наличие ключевых проектов
          for must_have in [
              "mainparadox/cloudflare-manager-iac",
              "mainparadox/GENERATOR_GENAI2_STORY",
              "polarrecoveryapp/polar-recovery-club",
              "mainparadox/github-stats-private",
              "mainparadox/pinpoint-ai",
          ]:
              repos.setdefault(must_have, True)

          # 2. Клонируем репозитории
          for full_name in sorted(repos.keys()):
              folder = os.path.join(workspace, full_name.replace("/", "__"))
              clone_url = (
                  f"https://x-access-token:{gh_token}@github.com/{full_name}.git"
                  if gh_token
                  else f"https://github.com/{full_name}.git"
              )
              subprocess.run(
                  ["git", "clone", "--depth", "1", clone_url, folder],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )

          def run_tokei(target_dir: str) -> dict:
              if not os.path.exists(target_dir):
                  return {}
              cmd = [
                  "tokei",
                  target_dir,
                  "-e", "*.json",
                  "-e", "*.svg",
                  "-e", "*.min.js",
                  "-e", "*.lock",
                  "-e", "node_modules",
                  "-e", "dist",
                  "-e", "build",
                  "-e", "vendor",
                  "-e", ".venv",
                  "-e", "venv",
                  "-e", "__pycache__",
                  "-e", "target",
                  "-o", "json",
              ]
              res = subprocess.run(cmd, capture_output=True, text=True, check=True)
              return json.loads(res.stdout)

          raw = run_tokei(workspace)

          # 3. Игнорируем документацию/конфиги и группируем связанные языки
          IGNORED_LANGS = {
              "Total", "Markdown", "Plain Text", "YAML", "TOML", "INI",
              "XML", "CSV", "ReStructuredText", "TeX", "JSON", "SVG",
              "Autoconf", "CMake", "Makefile",
          }

          GROUP_MAP = {
              "TypeScript": "TypeScript",
              "TSX": "TypeScript",
              "JSX": "React UI (JSX)",
              "HTML": "HTML & CSS",
              "CSS": "HTML & CSS",
              "SCSS": "HTML & CSS",
              "Sass": "HTML & CSS",
              "HCL": "Terraform (HCL)",
              "Terraform": "Terraform (HCL)",
          }

          COLOR_MAP = {
              "Python": "#3b82f6",
              "JavaScript": "#f59e0b",
              "TypeScript": "#3178c6",
              "React UI (JSX)": "#06b6d4",
              "HTML & CSS": "#10b981",
              "Terraform (HCL)": "#844fba",
              "Shell": "#4eaa25",
              "Bash": "#4eaa25",
              "Swift": "#fa7343",
              "Kotlin": "#7f52ff",
              "Rust": "#dea584",
              "Go": "#00add8",
              "PHP": "#777bb4",
              "SQL": "#e38c00",
              "Dockerfile": "#2496ed",
          }
          FALLBACK_COLORS = ["#8b5cf6", "#ec4899", "#14b8a6", "#f97316", "#6366f1", "#84cc16"]

          grouped = {}
          for lang, data in raw.items():
              if lang in IGNORED_LANGS or not isinstance(data, dict):
                  continue
              code = int(data.get("code", 0) or 0)
              if code <= 0:
                  continue
              display_name = GROUP_MAP.get(lang, lang)
              grouped[display_name] = grouped.get(display_name, 0) + code

          total_loc = sum(grouped.values()) or 1
          f_total = f"{total_loc / 1000:.1f}K"

          # Берём языки от 0.5% и выше (до 8 штук)
          sorted_langs = sorted(grouped.items(), key=lambda x: x[1], reverse=True)
          display_langs = [
              (name, loc) for name, loc in sorted_langs if (loc * 100.0 / total_loc) >= 0.5
          ][:8]

          # Назначаем цвета
          used_colors = set()
          fallback_idx = 0
          lang_entries = []
          for name, loc in display_langs:
              color = COLOR_MAP.get(name)
              if not color or color in used_colors:
                  while FALLBACK_COLORS[fallback_idx % len(FALLBACK_COLORS)] in used_colors and fallback_idx < 20:
                      fallback_idx += 1
                  color = FALLBACK_COLORS[fallback_idx % len(FALLBACK_COLORS)]
                  fallback_idx += 1
              used_colors.add(color)
              pct_int = max(1, round(loc * 100.0 / total_loc))
              lang_entries.append((name, loc, pct_int, color))

          # 4. Генерируем loc-badge.svg
          with open("loc-badge.svg", "w", encoding="utf-8") as f:
              f.write(f"""<svg xmlns="http://www.w3.org/2000/svg" width="160" height="20" role="img">
            <clipPath id="r"><rect width="160" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="100" height="20" fill="#0f172a"/>
              <rect x="100" width="60" height="20" fill="#2563eb"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
              <text x="50" y="14" fill="#94a3b8">lines of code</text>
              <text x="130" y="14" font-weight="bold">{f_total}</text>
            </g>
          </svg>
          """)

          # 5. Генерируем languages-loc.svg с динамической сеткой и высотой
          rows = max(1, math.ceil(len(lang_entries) / 2))
          svg_height = 66 + rows * 42

          bar_segments = []
          cur_x = 22.0
          bar_w = 356.0
          for name, loc, pct_int, color in lang_entries:
              seg_w = bar_w * (loc / total_loc)
              bar_segments.append(
                  f'    <rect x="{cur_x:.2f}" y="44" width="{seg_w:.2f}" height="7" fill="{color}"/>'
              )
              cur_x += seg_w

          grid_items = []
          for idx, (name, loc, pct_int, color) in enumerate(lang_entries):
              col = idx % 2
              row = idx // 2
              cx = 28 if col == 0 else 212
              tx = 40 if col == 0 else 224
              cy = 72 + row * 42
              y_title = cy + 4
              y_sub = cy + 19
              safe_name = html.escape(name)
              grid_items.append(
                  f'    <circle cx="{cx}" cy="{cy}" r="5" fill="{color}"/>\n'
                  f'    <text x="{tx}" y="{y_title}" fill="#0f172a" font-size="13" font-weight="700">{safe_name}</text>\n'
                  f'    <text x="{tx}" y="{y_sub}" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11">{loc} строк ({pct_int}%)</text>'
              )

          with open("languages-loc.svg", "w", encoding="utf-8") as f:
              f.write(
                  f"""<svg xmlns="http://www.w3.org/2000/svg" width="400" height="{svg_height}" viewBox="0 0 400 {svg_height}" fill="none">
            <rect width="400" height="{svg_height}" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

            <text x="22" y="32" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Codebase Breakdown</text>
            <text x="378" y="31" text-anchor="end" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">{f_total} LOC</text>

            <clipPath id="bar-clip">
              <rect x="22" y="44" width="356" height="7" rx="3.5"/>
            </clipPath>
            <rect x="22" y="44" width="356" height="7" rx="3.5" fill="#f1f5f9"/>
            <g clip-path="url(#bar-clip)">
          {chr(10).join(bar_segments)}
            </g>

            <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
          {chr(10).join(grid_items)}
            </g>
          </svg>
          """
              )

          # 6. Бейджи конкретных проектов
          def repo_loc(repo_slug: str) -> str:
              data = run_tokei(os.path.join(workspace, repo_slug.replace("/", "__")))
              code = int((data.get("Total") or {}).get("code", 0) or 0)
              return f"{code / 1000:.1f}K"

          f_polar = repo_loc("polarrecoveryapp/polar-recovery-club")
          f_ggs = repo_loc("mainparadox/GENERATOR_GENAI2_STORY")
          f_cf = repo_loc("mainparadox/cloudflare-manager-iac")
          f_pinpoint = repo_loc("mainparadox/pinpoint-ai")

          with open("badge-polar.svg", "w", encoding="utf-8") as f:
              f.write(f"""<svg xmlns="http://www.w3.org/2000/svg" width="145" height="20" role="img">
            <clipPath id="r"><rect width="145" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="65" height="20" fill="#0f172a"/>
              <rect x="65" width="80" height="20" fill="#0284c7"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
              <text x="32" y="14" fill="#94a3b8">codebase</text>
              <text x="105" y="14" font-weight="bold">{f_polar} LOC</text>
            </g>
          </svg>
          """)

          with open("badge-ggs.svg", "w", encoding="utf-8") as f:
              f.write(f"""<svg xmlns="http://www.w3.org/2000/svg" width="145" height="20" role="img">
            <clipPath id="r"><rect width="145" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="65" height="20" fill="#0f172a"/>
              <rect x="65" width="80" height="20" fill="#dc2626"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
              <text x="32" y="14" fill="#94a3b8">codebase</text>
              <text x="105" y="14" font-weight="bold">{f_ggs} LOC</text>
            </g>
          </svg>
          """)

          with open("badge-cloudflare.svg", "w", encoding="utf-8") as f:
              f.write(f"""<svg xmlns="http://www.w3.org/2000/svg" width="140" height="20" role="img">
            <clipPath id="r"><rect width="140" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="65" height="20" fill="#0f172a"/>
              <rect x="65" width="75" height="20" fill="#ea580c"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
              <text x="32" y="14" fill="#94a3b8">codebase</text>
              <text x="102" y="14" font-weight="bold">{f_cf} LOC</text>
            </g>
          </svg>
          """)

          with open("badge-pinpoint.svg", "w", encoding="utf-8") as f:
              f.write(f"""<svg xmlns="http://www.w3.org/2000/svg" width="145" height="20" role="img">
            <clipPath id="r"><rect width="145" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="65" height="20" fill="#0f172a"/>
              <rect x="65" width="80" height="20" fill="#4f46e5"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
              <text x="32" y="14" fill="#94a3b8">codebase</text>
              <text x="105" y="14" font-weight="bold">{f_pinpoint} LOC</text>
            </g>
          </svg>
          """)
          PY

      - name: Commit Badge & Cards to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add loc-badge.svg languages-loc.svg badge-polar.svg badge-ggs.svg badge-cloudflare.svg badge-pinpoint.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update codebase stats and language cards [skip ci]" && git push)
