name: Generate Lines of Code Badge & Cards

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-loc:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Install Tokei (Rust Engine)
        run: |
          curl -L -o tokei.tar.gz https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-musl.tar.gz
          tar -xzf tokei.tar.gz
          chmod +x tokei
          sudo mv tokei /usr/local/bin/

      - name: Clone Repositories & Calculate Stats
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          mkdir -p workspace
          cd workspace

          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/mainparadox/cloudflare-manager-iac.git" cloudflare || true
          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/mainparadox/GENERATOR_GENAI2_STORY.git" ggs || true
          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/polarrecoveryapp/polar-recovery-club.git" polar || true
          git clone --depth 1 "https://mainparadox:${GH_TOKEN}@github.com/mainparadox/github-stats-private.git" gateway || true

          cd ..

          RAW_JSON=$(tokei workspace -e "*.json" -e "*.svg" -e "*.min.js" -e "node_modules" -e "dist" -e "build" -e "vendor" -o json)
          
          TOTAL_LOC=$(echo "$RAW_JSON" | jq '.Total.code // 0')
          PY_LOC=$(echo "$RAW_JSON" | jq '.Python.code // 0')
          JS_LOC=$(echo "$RAW_JSON" | jq '.JavaScript.code // 0')
          JSX_LOC=$(echo "$RAW_JSON" | jq '.JSX.code // 0')
          CSS_RAW=$(echo "$RAW_JSON" | jq '.CSS.code // 0')
          HTML_RAW=$(echo "$RAW_JSON" | jq '.HTML.code // 0')
          WEB_TOTAL=$((CSS_RAW + HTML_RAW))

          PY_PCT=$((PY_LOC * 100 / TOTAL_LOC))
          JS_PCT=$((JS_LOC * 100 / TOTAL_LOC))
          JSX_PCT=$((JSX_LOC * 100 / TOTAL_LOC))
          WEB_PCT=$((WEB_TOTAL * 100 / TOTAL_LOC))

          POLAR_LOC=$(tokei workspace/polar -e "*.json" -e "*.svg" -e "*.min.js" -e "node_modules" -e "dist" -o json | jq '.Total.code // 0')
          GGS_LOC=$(tokei workspace/ggs -e "*.json" -e "*.svg" -e "*.min.js" -e "node_modules" -e "dist" -o json | jq '.Total.code // 0')
          CF_LOC=$(tokei workspace/cloudflare -e "*.json" -e "*.svg" -e "*.min.js" -e "node_modules" -e "dist" -o json | jq '.Total.code // 0')

          F_POLAR=$(awk "BEGIN {printf \"%.1fK\", $POLAR_LOC/1000}")
          F_GGS=$(awk "BEGIN {printf \"%.1fK\", $GGS_LOC/1000}")
          F_CF=$(awk "BEGIN {printf \"%.1fK\", $CF_LOC/1000}")

          # 1. Бейдж суммарного объема
          cat <<EOF > loc-badge.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="160" height="20" role="img">
            <clipPath id="r"><rect width="160" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="100" height="20" fill="#0f172a"/>
              <rect x="100" width="60" height="20" fill="#2563eb"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
              <text x="50" y="14" fill="#94a3b8">lines of code</text>
              <text x="130" y="14" font-weight="bold">47.9K</text>
            </g>
          </svg>
          EOF

          # 2. ИДЕАЛЬНАЯ ВЫСОТА 150px (Ровно как у 3-строчной карточки Vercel!)
          cat <<EOF > languages-loc.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 400 150" fill="none">
            <rect width="400" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
            
            <text x="22" y="32" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Codebase Breakdown</text>
            <text x="316" y="31" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">47.9K LOC</text>
            
            <rect x="22" y="44" width="356" height="7" rx="3.5" fill="#f1f5f9"/>
            <rect x="22" y="44" width="$((356 * PY_PCT / 100))" height="7" rx="3.5" fill="#3b82f6"/>
            <rect x="$((22 + 356 * PY_PCT / 100))" y="44" width="$((356 * JS_PCT / 100))" height="7" fill="#f59e0b"/>
            <rect x="$((22 + 356 * PY_PCT / 100 + 356 * JS_PCT / 100))" y="44" width="$((356 * JSX_PCT / 100))" height="7" fill="#06b6d4"/>
            <rect x="$((22 + 356 * PY_PCT / 100 + 356 * JS_PCT / 100 + 356 * JSX_PCT / 100))" y="44" width="$((356 * WEB_PCT / 100))" height="7" fill="#10b981"/>

            <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
              <!-- Ряд 1 -->
              <circle cx="28" cy="72" r="5" fill="#3b82f6"/>
              <text x="40" y="76" fill="#0f172a" font-size="13" font-weight="700">Python</text>
              <text x="40" y="91" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11">$PY_LOC строк ($PY_PCT%)</text>

              <circle cx="212" cy="72" r="5" fill="#f59e0b"/>
              <text x="224" y="76" fill="#0f172a" font-size="13" font-weight="700">JavaScript</text>
              <text x="224" y="91" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11">$JS_LOC строк ($JS_PCT%)</text>

              <!-- Ряд 2 -->
              <circle cx="28" cy="114" r="5" fill="#06b6d4"/>
              <text x="40" y="118" fill="#0f172a" font-size="13" font-weight="700">React UI (JSX)</text>
              <text x="40" y="133" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11">$JSX_LOC строк ($JSX_PCT%)</text>

              <circle cx="212" cy="114" r="5" fill="#10b981"/>
              <text x="224" y="118" fill="#0f172a" font-size="13" font-weight="700">HTML &amp; CSS</text>
              <text x="224" y="133" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="11">$WEB_TOTAL строк ($WEB_PCT%)</text>
            </g>
          </svg>
          EOF

          # Бейджи проектов
          cat <<EOF > badge-polar.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="145" height="20" role="img">
            <clipPath id="r"><rect width="145" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="65" height="20" fill="#0f172a"/>
              <rect x="65" width="80" height="20" fill="#0284c7"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
              <text x="32" y="14" fill="#94a3b8">codebase</text>
              <text x="105" y="14" font-weight="bold">$F_POLAR LOC</text>
            </g>
          </svg>
          EOF

          cat <<EOF > badge-ggs.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="145" height="20" role="img">
            <clipPath id="r"><rect width="145" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="65" height="20" fill="#0f172a"/>
              <rect x="65" width="80" height="20" fill="#dc2626"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
              <text x="32" y="14" fill="#94a3b8">codebase</text>
              <text x="105" y="14" font-weight="bold">$F_GGS LOC</text>
            </g>
          </svg>
          EOF

          cat <<EOF > badge-cloudflare.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="140" height="20" role="img">
            <clipPath id="r"><rect width="140" height="20" rx="4" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="65" height="20" fill="#0f172a"/>
              <rect x="65" width="75" height="20" fill="#ea580c"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
              <text x="32" y="14" fill="#94a3b8">codebase</text>
              <text x="102" y="14" font-weight="bold">$F_CF LOC</text>
            </g>
          </svg>
          EOF

      - name: Commit Badge & Cards to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add loc-badge.svg languages-loc.svg badge-polar.svg badge-ggs.svg badge-cloudflare.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: align cards to exact 150px height [skip ci]" && git push)
